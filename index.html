<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catcha Kanban Board</title>
    <meta
      name="description"
      content="A sleek Kanban board for managing your tasks and workflow"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="./src/components/kanban-board-modal/kanban-board-modal.css"
    />
    <link rel="stylesheet" href="./src/components/header/header.css" />
    <link
      rel="stylesheet"
      href="./src/components/kanban-column/kanban-column.css"
    />
    <link rel="stylesheet" href="./src/components/task-card/task-card.css" />
    <link rel="stylesheet" href="./src/components/task-modal/task-modal.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/idb@8/build/umd.js"></script>
    <link
      rel="stylesheet"
      href="./src/components/delete-modal/delete-modal.css"
    />
  </head>

  <body class="page-body">
    <div class="app-container" id="app-container">
      <nav class="sidebar" id="sidebar" aria-label="Boards navigation">
        <div class="logo" aria-hidden="false">
          <i data-lucide="paw-print" aria-hidden="true"></i>
          <span class="logo__text">Team CATcha</span>
        </div>
        <div
          class="boards-list"
          id="boards-nav"
          role="list"
          aria-label="Your boards"
        ></div>
        <button
          class="add-board-button focus-none focus-ring"
          id="add-board-button"
          aria-label="Add new Kanban board"
        >
          + Add Kanban Board
        </button>
      </nav>

      <main class="main-content" id="main-content">
        <header class="header" role="banner">
          <div class="header__left">
            <button
              class="header__menu-button focus-none focus-ring"
              id="sidebar-toggle"
              aria-label="Toggle sidebar"
            >
              <i
                data-lucide="menu"
                class="header__menu-icon"
                aria-hidden="true"
              ></i>
            </button>
            <h1 class="header__title heading-reset" id="board-title">
              Kanban Board
            </h1>
            <button
              class="header__add-task-button focus-none"
              id="universal-add-task-button"
              aria-label="Add new task"
            >
              <i
                data-lucide="plus"
                class="header__add-task-icon"
                aria-hidden="true"
              ></i>
              <span>Add Task</span>
            </button>
          </div>
        </header>

        <div
          class="kanban-view"
          id="app"
          role="region"
          aria-label="Kanban board"
        ></div>
      </main>
      <div class="sidebar-overlay" id="sidebar-overlay"></div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
