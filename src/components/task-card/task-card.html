<div class="task-card__header flex justify-between items-start gap-sm">
  <h3
    class="task-card__title text-base font-semibold text-primary m-0 leading-tight"
  ></h3>
  <div class="task-card__actions flex flex-row items-center">
    <button
      class="task-card__move-back-button focus-none cursor-pointer text-muted transition-fast flex items-center justify-center border-none bg-transparent p-0"
      aria-label="Move task to previous status"
    >
      <i data-lucide="circle-arrow-left" class="task-card__icon"></i>
    </button>
    <button
      class="task-card__move-button focus-none cursor-pointer text-muted transition-fast flex items-center justify-center border-none bg-transparent p-0"
      aria-label="Move task to next status"
    >
      <i data-lucide="circle-check" class="task-card__icon"></i>
    </button>
    <button
      class="task-card__edit-button focus-none cursor-pointer text-muted transition-fast flex items-center justify-center border-none bg-transparent p-0"
      aria-label="Edit task"
    >
      <i data-lucide="pencil" class="task-card__icon"></i>
    </button>
    <button
      class="task-card__delete-button focus-none cursor-pointer text-muted transition-fast flex items-center justify-center border-none bg-transparent p-0"
      aria-label="Delete task"
    >
      <i data-lucide="trash" class="task-card__icon"></i>
    </button>
  </div>
</div>
<div class="task-card__info flex flex-col gap-xs mt-xs"></div>
<div class="task-card__footer flex justify-start mt-xs"></div>
