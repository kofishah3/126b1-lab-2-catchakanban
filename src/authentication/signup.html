<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kanban – Sign Up</title>
  <link rel="stylesheet" href="signup.css">
  <link rel="stylesheet" href="shared.css">
</head>
<body>

<div class="card card-md">
  <button class="back-link" onclick="location.href='index.html'">
    ← Back to Home
  </button>

  <div class="logo">CATCHA <span>Kanban</span></div>
  <div class="card-title">Create your account</div>

  <!-- Step Indicator -->
  <div class="steps" id="steps-bar">
    <div class="step-item active" id="step-ind-1">
      <div class="step-num">1</div>
      <div class="step-label">Details</div>
    </div>
    <div class="step-line"></div>
    <div class="step-item" id="step-ind-2">
      <div class="step-num">2</div>
      <div class="step-label">Credentials</div>
    </div>
  </div>

  <div class="alert" id="signup-alert"></div>

  <div id="form-area">

    <!-- Step 1: Personal Details -->
    <div class="step-panel active" id="panel-1">
      <div class="form-group">
        <label>First Name</label>
        <input type="text" id="reg-first-name" placeholder="e.g. Juan"/>
      </div>

      <div class="form-group">
        <label>Last Name</label>
        <input type="text" id="reg-last-name" placeholder="e.g. Dela Cruz"/>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="Enter your email"/>
      </div>

      <div class="btn-row">
        <button onclick="Signup.next()">Next →</button>
      </div>
    </div>

    <!-- Step 2: Credentials -->
    <div class="step-panel" id="panel-2">
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="Create a password"/>
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="reg-confirm" placeholder="Repeat your password"/>
      </div>

      <div class="btn-row">
        <button onclick="Signup.back()">← Back</button>
        <button id="submit-btn" onclick="Signup.submit()">Submit →</button>
      </div>
    </div>

  </div>

  <!-- Success screen -->
  <div class="success-screen" id="signup-success" style="display:none;">
    <h2>Account Created!</h2>
    <p>You can now log in using your credentials.</p>
    <button onclick="location.href='login.html'">← Go to Log In</button>
  </div>

  <div class="footer-link" id="signup-footer">
    Already have an account?
    <button onclick="location.href='login.html'">Log in here</button>
  </div>
</div>

<script src="signup.js"></script>
</body>
</html>
